[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "carlaair-eval"
version = "0.1.0"
description = "Diagnostic evaluation suite for the CarlaAir cooperative VLA paper."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["carlaair_eval*"]

[tool.setuptools.package-data]
"carlaair_eval.scenarios" = ["data/*.json"]
